version: 56
jobs:
- name: Wiki
  steps:
  - !CheckoutStep
    name: checkout
    cloneCredential: !HttpCredential
      accessTokenSecret: onedev-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: publish the wiki
    runInContainer: true
    image: buildpack-deps:bookworm-scm
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        DOCS=docs sh .onedev/wiki.sh "@server_url@/@project_path@" "@branch@"
        git add -A wiki
        if git diff --cached --quiet; then
          echo "The wiki is up to date."
          exit 0
        fi
        git -c user.name="OneDev" -c user.email="onedev@@evcsbrw.ru" commit -q -m "Wiki from @commit_hash@"
        git push -q origin HEAD:@branch@
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !BranchUpdateTrigger
    branches: main
    paths: docs/** README.md README.ru.md .onedev/wiki.sh
    userMatch: anyone
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  timeout: 3600
- name: Release
  steps:
  - !CheckoutStep
    name: checkout
    cloneCredential: !HttpCredential
      accessTokenSecret: onedev-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: version
    runInContainer: true
    image: busybox:1.36
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        v=@tag@
        v=${v#v}
        mkdir -p .ci
        printf %s "$v" > .ci/version
        printf %s "${v%.*}" > .ci/minor
        date -u +%Y-%m-%dT%H:%M:%SZ | tr -d '\n' > .ci/built
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: SonarQube quality gate
    runInContainer: true
    image: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        sonar-scanner -Dsonar.token='@secret:sonar-token@' -Dsonar.projectVersion="$(cat .ci/version)" \
          -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=900
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false

  - !SetBuildVersionStep
    name: build version
    buildVersion: '@tag@'
    condition: SUCCESSFUL
    optional: false
  - !BuildImageWithKanikoStep
    name: image current
    buildContext: app
    output: !RegistryOutput
      destinations: '@server@/monitoring/current/current:@file:.ci/version@ @server@/monitoring/current/current:@file:.ci/minor@ @server@/monitoring/current/current:latest'
    registryLogins:
      - registryUrl: '@server_url@'
        userName: '@job_token@'
        passwordSecret: onedev-token
    moreOptions: --build-arg VERSION=@file:.ci/version@ --build-arg COMMIT=@commit_hash@ --build-arg BUILT_AT=@file:.ci/built@
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: deploy bundle
    runInContainer: true
    image: mikefarah/yq:4
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        V=$(cat .ci/version)
        sh .onedev/bundle.sh "@server@/monitoring/current/current" "$V" "@server_url@/@project_path@/~builds/@build_number@/artifacts"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !PublishArtifactStep
    name: publish the bundle
    sourcePath: dist
    artifacts: '*.tar.gz SHA256SUMS notes.md'
    condition: SUCCESSFUL
    optional: false
  - !SetBuildDescriptionStep
    name: build description
    buildDescription: 'Current @tag@: images @server@/monitoring/current/... (@tag@, latest), the deploy bundle and its notes are in the artifacts.'
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: SonarQube wiki page
    runInContainer: true
    image: buildpack-deps:bookworm-scm
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        SONAR_TOKEN='@secret:sonar-token@' sh .onedev/sonar-wiki.sh "@tag@" "@commit_hash@" main
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: true
  - !CommandStep
    name: 'GitHub: copy images'
    runInContainer: true
    image: gcr.io/go-containerregistry/crane:debug
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        V=$(cat .ci/version)
        M=$(cat .ci/minor)
        crane auth login @server@ -u '@job_token@' -p '@secret:onedev-token@'
        crane auth login ghcr.io -u sbrw-evc -p '@secret:github-token@'
        crane copy @server@/monitoring/current/current:$V ghcr.io/sbrw-evc/current:$V
        crane tag ghcr.io/sbrw-evc/current:$V $M
        crane tag ghcr.io/sbrw-evc/current:$V latest
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: true
  - !CommandStep
    name: 'GitHub: release bundle'
    runInContainer: true
    image: mikefarah/yq:4
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        V=$(cat .ci/version)
        sh .onedev/bundle.sh "ghcr.io/sbrw-evc/current" "$V" "https://github.com/sbrw-evc/Current/releases/download/@tag@/current-$V-deploy.tar.gz" dist-github
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: true
  - !CommandStep
    name: 'GitHub: release'
    runInContainer: true
    image: buildpack-deps:bookworm-scm
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        GITHUB_TOKEN='@secret:github-token@' COMMIT=@commit_hash@ \
          sh .onedev/github.sh release sbrw-evc/Current "@tag@" "Current @tag@" dist-github
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: true
  triggers:
  - !TagCreateTrigger
    tags: v*.*.*
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  timeout: 7200
- name: SonarQube
  steps:
  - !CheckoutStep
    name: checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: SonarQube analysis
    runInContainer: true
    image: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        sonar-scanner -Dsonar.token='@secret:sonar-token@' -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=900
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  timeout: 3600
- name: GitHub sync
  steps:
  - !PushRepository
    name: push to GitHub
    remoteUrl: https://github.com/sbrw-evc/Current
    userName: x-access-token
    passwordSecret: github-token
    force: false
    condition: SUCCESSFUL
    optional: false
  - !CheckoutStep
    name: checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: GitHub wiki
    runInContainer: true
    image: buildpack-deps:bookworm-scm
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        set -eu
        if [ "@branch@" != main ] || [ ! -d wiki ]; then
          echo "The wiki is published from main only."
          exit 0
        fi
        GITHUB_TOKEN='@secret:github-token@' COMMIT=@commit_hash@ sh .onedev/github.sh wiki sbrw-evc/Current
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !BranchUpdateTrigger
    userMatch: anyone
  - !TagCreateTrigger {}
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  timeout: 3600
