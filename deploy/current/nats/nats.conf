# NATS 2.11 with JetStream for the Current pipeline (collector -> enricher).
server_name: flow-nats
port: 4222
http_port: 8222

# The client token comes from the command line (--auth, see docker-compose.yml).

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 20GB
}

max_payload: 8MB
