apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "current.fullname" . }}-env
  labels:
    {{- include "current.labels" . | nindent 4 }}
data:
  FLOW_ADDR: {{ printf ":%d" (int .Values.ports.http) | quote }}
  FLOW_DATA_DIR: /data
  FLOW_NETFLOW_ADDR: {{ printf ":%d" (int .Values.ports.netflow) | quote }}
  FLOW_SFLOW_ADDR: {{ printf ":%d" (int .Values.ports.sflow) | quote }}
  FLOW_BMP_ADDR: {{ printf ":%d" (int .Values.ports.bmp) | quote }}
  FLOW_SECURE_COOKIES: {{ .Values.config.secureCookies | quote }}
  FLOW_TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  FLOW_STARTUP_WAIT: {{ .Values.config.startupWait | quote }}
  # Prefill of the setup wizard; passwords are openbao:// references only.
  FLOW_SETUP_DEFAULTS_LANGUAGE: {{ .Values.config.language | quote }}
  FLOW_SETUP_DEFAULTS_TIMEZONE: {{ .Values.config.timezone | quote }}
  FLOW_SETUP_DEFAULTS_PUBLIC_URL: {{ .Values.config.publicURL | quote }}
  FLOW_SETUP_DEFAULTS_OPENBAO_ADDR: {{ include "current.openbaoAddr" . | quote }}
  FLOW_SETUP_DEFAULTS_OPENBAO_MOUNT: {{ .Values.openbao.mount | quote }}
  {{- if or .Values.dev.enabled (eq .Values.openbao.auth "token") }}
  FLOW_SETUP_DEFAULTS_OPENBAO_AUTH: token
  FLOW_SETUP_DEFAULTS_OPENBAO_TOKEN_FILE: /run/openbao/token
  {{- else }}
  FLOW_SETUP_DEFAULTS_OPENBAO_AUTH: approle
  FLOW_SETUP_DEFAULTS_OPENBAO_ROLE_ID_FILE: /run/openbao/role_id
  FLOW_SETUP_DEFAULTS_OPENBAO_SECRET_ID_FILE: /run/openbao/secret_id
  {{- end }}
  FLOW_SETUP_DEFAULTS_POSTGRES_HOST: {{ include "current.postgresHost" . | quote }}
  FLOW_SETUP_DEFAULTS_POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  FLOW_SETUP_DEFAULTS_POSTGRES_DATABASE: {{ .Values.postgres.database | quote }}
  FLOW_SETUP_DEFAULTS_POSTGRES_USERNAME: {{ .Values.postgres.username | quote }}
  FLOW_SETUP_DEFAULTS_POSTGRES_SSLMODE: {{ ternary "disable" .Values.postgres.sslmode .Values.dev.enabled | quote }}
  FLOW_SETUP_DEFAULTS_POSTGRES_PASSWORD_REF: {{ .Values.postgres.passwordRef | quote }}
  FLOW_SETUP_DEFAULTS_CLICKHOUSE_ADDR: {{ include "current.clickhouseAddr" . | quote }}
  FLOW_SETUP_DEFAULTS_CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  FLOW_SETUP_DEFAULTS_CLICKHOUSE_USERNAME: {{ .Values.clickhouse.username | quote }}
  FLOW_SETUP_DEFAULTS_CLICKHOUSE_SECURE: {{ .Values.clickhouse.secure | quote }}
  FLOW_SETUP_DEFAULTS_CLICKHOUSE_PASSWORD_REF: {{ .Values.clickhouse.passwordRef | quote }}
  FLOW_SETUP_DEFAULTS_NATS_URL: {{ include "current.natsURL" . | quote }}
  FLOW_SETUP_DEFAULTS_NATS_TOKEN_REF: {{ .Values.nats.tokenRef | quote }}
  FLOW_SETUP_DEFAULTS_NETFLOW_ADDR: {{ printf ":%d" (int .Values.ports.netflow) | quote }}
  FLOW_SETUP_DEFAULTS_SFLOW_ADDR: {{ printf ":%d" (int .Values.ports.sflow) | quote }}
  FLOW_SETUP_DEFAULTS_GEOIP_DATABASES: {{ .Values.config.geoipDatabases | quote }}
  FLOW_SETUP_DEFAULTS_INVENTORY_URL: {{ .Values.config.inventoryURL | quote }}
  FLOW_SETUP_DEFAULTS_UMBRELLA_INGEST_URL: {{ .Values.config.umbrellaIngestURL | quote }}
{{- if .Values.config.flowJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "current.fullname" . }}-flowjson
  labels:
    {{- include "current.labels" . | nindent 4 }}
data:
  flow.json: {{ .Values.config.flowJson | quote }}
{{- end }}
