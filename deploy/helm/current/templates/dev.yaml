{{- if .Values.dev.enabled }}
{{- $name := include "current.devName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing }}{{- $data = $existing.data -}}{{- end -}}
# Development services: generated credentials, kept across upgrades. Current
# itself reads the database passwords from OpenBao (seeded below), never
# from this Secret; only the OpenBao dev token is mounted into Current.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "current.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ get $data "postgres-password" | default (randAlphaNum 24 | b64enc) }}
  clickhouse-password: {{ get $data "clickhouse-password" | default (randAlphaNum 24 | b64enc) }}
  nats-token: {{ get $data "nats-token" | default (randAlphaNum 32 | b64enc) }}
  openbao-token: {{ get $data "openbao-token" | default (randAlphaNum 32 | b64enc) }}
{{- range $svc := list "postgres" "clickhouse" "nats" "openbao" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $svc }}
  labels:
    {{- include "current.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "current.selector" (dict "root" $ "role" (printf "dev-%s" $svc)) | nindent 4 }}
  ports:
    {{- if eq $svc "postgres" }}
    - {name: postgres, port: 5432, targetPort: 5432}
    {{- else if eq $svc "clickhouse" }}
    - {name: native, port: 9000, targetPort: 9000}
    - {name: http, port: 8123, targetPort: 8123}
    {{- else if eq $svc "nats" }}
    - {name: client, port: 4222, targetPort: 4222}
    {{- else }}
    - {name: api, port: 8200, targetPort: 8200}
    {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-postgres
  labels:
    {{- include "current.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "current.selector" (dict "root" . "role" "dev-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "current.selector" (dict "root" . "role" "dev-postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.dev.postgres.image }}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: postgres-password}}
            - {name: POSTGRES_INITDB_ARGS, value: --auth-host=scram-sha-256}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.dev.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.dev.postgres.size }}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-clickhouse
  labels:
    {{- include "current.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "current.selector" (dict "root" . "role" "dev-clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "current.selector" (dict "root" . "role" "dev-clickhouse") | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.dev.clickhouse.image }}
          env:
            - {name: CLICKHOUSE_DB, value: {{ .Values.clickhouse.database | quote }}}
            - {name: CLICKHOUSE_USER, value: {{ .Values.clickhouse.username | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: clickhouse-password}}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
          ports: [{containerPort: 9000}, {containerPort: 8123}]
          readinessProbe:
            httpGet: {path: /ping, port: 8123}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dev.clickhouse.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/clickhouse}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.dev.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.dev.clickhouse.size }}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-nats
  labels:
    {{- include "current.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "current.selector" (dict "root" . "role" "dev-nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "current.selector" (dict "root" . "role" "dev-nats") | nindent 8 }}
    spec:
      containers:
        - name: nats
          image: {{ .Values.dev.nats.image }}
          args: ["-js", "-sd", "/data", "-m", "8222", "--auth", "$(NATS_TOKEN)", "--max_payload", "8MB"]
          env:
            - name: NATS_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: nats-token}}
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.dev.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.dev.nats.size }}}}
---
# OpenBao in dev mode (in memory). The seed container enables the KV v2
# mount and writes the service passwords on every start of the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-openbao
  labels:
    {{- include "current.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "current.selector" (dict "root" . "role" "dev-openbao") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "current.selector" (dict "root" . "role" "dev-openbao") | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.dev.openbao.image }}
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=$(BAO_DEV_ROOT_TOKEN)"]
          env:
            - name: BAO_DEV_ROOT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: openbao-token}}
            - {name: SKIP_SETCAP, value: "true"}
          ports: [{containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 5
        - name: seed
          image: {{ .Values.dev.openbao.image }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until bao status >/dev/null 2>&1; do sleep 2; done
              bao secrets list | grep -q "^{{ .Values.openbao.mount }}/" || bao secrets enable -path={{ .Values.openbao.mount }} -version=2 kv
              bao kv put -mount={{ .Values.openbao.mount }} postgres password="$PG" >/dev/null
              bao kv put -mount={{ .Values.openbao.mount }} clickhouse password="$CH" >/dev/null
              bao kv put -mount={{ .Values.openbao.mount }} nats token="$NT" >/dev/null
              echo "seeded"; exec sleep 2147483647
          env:
            - {name: BAO_ADDR, value: "http://127.0.0.1:8200"}
            - name: BAO_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: openbao-token}}
            - name: PG
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: postgres-password}}
            - name: CH
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: clickhouse-password}}
            - name: NT
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: nats-token}}
{{- end }}
