# Joins Flow to the external Docker network "umbrella" shared with Umbrella
# Monitoring and Inventory DB (docker network create umbrella, if it is not
# there yet). Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.umbrella.yml
# in .env; Flow is then reachable there as http://flow:8080.
services:
  flow:
    networks:
      default:
      umbrella:
        aliases: [flow, umbrella-flow]

networks:
  umbrella:
    name: umbrella
    external: true
