name: Wiki

# Publishes the documentation to the GitHub wiki of the repository on every change in main. docs/wiki/ is published
# as it is when it exists; otherwise the wiki is made from README.md (the home page), README.ru.md and the documents
# of DOCS (one page each, links between them turned into wiki links, images alongside).
# The wiki must exist once: open the Wiki tab on GitHub and create the first page, then this workflow keeps it.

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "README.ru.md", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

env:
  DOCS: docs

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the pages
        run: |
          set -eu
          OUT=/tmp/wiki-src
          mkdir -p "$OUT"
          if [ -d "$DOCS/wiki" ]; then
            cp -r "$DOCS/wiki/." "$OUT/"
            exit 0
          fi
          cp README.md "$OUT/Home.md"
          [ -f README.ru.md ] && cp README.ru.md "$OUT/Home-ru.md"
          for f in "$DOCS"/*.md; do
            [ -e "$f" ] && cp "$f" "$OUT/$(basename "$f")"
          done
          for d in "$DOCS"/*/; do
            [ -d "$d" ] && cp -r "$d" "$OUT/"
          done
          # Every relative link is resolved from the file it was written in: a document of DOCS becomes a wiki link,
          # a file copied along (images) keeps its path, anything else links to the file in the repository.
          for f in "$OUT"/*.md; do
            case "$(basename "$f")" in Home.md|Home-ru.md) from=. ;; *) from="$DOCS" ;; esac
            FROM="$from" BLOB="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME" RAW="https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_REF_NAME" perl -i -pe '
              use File::Spec;
              sub fix {
                my ($t) = @_;
                return $t if $t =~ m{^(?:[a-z][a-z0-9+.-]*:|#|/)}i;
                my ($p, $frag) = $t =~ m{^([^#]*)(#.*)?$}; $frag //= "";
                my @parts;
                for (split m{/}, File::Spec->canonpath("$ENV{FROM}/$p")) {
                  if ($_ eq "..") { pop @parts } elsif ($_ ne "." && $_ ne "") { push @parts, $_ }
                }
                my $r = join "/", @parts;
                return "Home$frag" if $r eq "README.md";
                return "Home-ru$frag" if $r eq "README.ru.md";
                my $d = $ENV{DOCS};
                if ($r =~ m{^\Q$d\E/([^/]+)\.md$}) { return "$1$frag" }
                if ($r =~ m{^\Q$d\E/(.+)$}) { return "$1$frag" }
                return "$ENV{RAW}/$r$frag" if $r =~ m{\.(?:png|jpe?g|gif|svg|webp)$}i;
                return "$ENV{BLOB}/$r$frag";
              }
              s{\]\(([^)\s]+)\)}{"](" . fix($1) . ")"}ge;
              s{(src|href)="([^"]+)"}{"$1=\"" . fix($2) . "\""}ge;
            ' "$f"
          done
          {
            if [ -f "$OUT/Home-ru.md" ]; then echo "**[Home](Home)** · [Русский](Home-ru)"; else echo "**[Home](Home)**"; fi
            echo
            for f in "$OUT"/*.md; do
              n=$(basename "$f" .md)
              case "$n" in Home|Home-ru|_Sidebar|_Footer) continue ;; esac
              echo "- [$n]($n)"
            done
          } > "$OUT/_Sidebar.md"
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! git clone -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki; then
            echo "::error::The wiki of ${GITHUB_REPOSITORY} does not exist yet: open the Wiki tab on GitHub, create the first page once, then run this workflow again."
            exit 1
          fi
          rsync -a --delete --exclude .git /tmp/wiki-src/ /tmp/wiki/
          cd /tmp/wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Wiki from ${GITHUB_SHA::7}"
          git push -q origin HEAD
