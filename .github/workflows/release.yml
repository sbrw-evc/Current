name: Release

# A tag vX.Y.Z publishes the image ghcr.io/<owner>/current (X.Y.Z, X.Y, latest; amd64 and arm64) and a GitHub release
# with the deploy bundle: deploy/current pinned to that image (FLOW_IMAGE, FLOW_VERSION), runnable without the sources.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  APP: current
  IMAGE: ghcr.io/${{ github.repository_owner }}/current

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          {
            echo "version=${TAG#v}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=current
            org.opencontainers.image.description=Current: what the network is doing, and changing it (flows, routing, devices, topology)
          annotations: |
            org.opencontainers.image.description=Current: what the network is doing, and changing it (flows, routing, devices, topology)
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.v.outputs.commit }}
            BUILT_AT=${{ steps.v.outputs.built }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Deploy bundle
        run: |
          set -eu
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DIR="dist/$APP-$VERSION"
          mkdir -p "$DIR"
          cp -r deploy/current/. "$DIR/"
          [ -e LICENSE ] && cp LICENSE "$DIR/"
          # The application runs from the published image of this version: no build section.
          yq -i '(.services[] | select(has("build"))) |= (del(.build) | .pull_policy = "missing")' "$DIR/docker-compose.yml"
          sed -i -e "s#^FLOW_IMAGE=.*#FLOW_IMAGE=$IMAGE:$VERSION#" -e "s#^FLOW_VERSION=.*#FLOW_VERSION=$VERSION#" "$DIR/.env.example"
          tar -C dist -czf "dist/$APP-$VERSION-deploy.tar.gz" "$APP-$VERSION"
          ( cd dist && sha256sum "$APP-$VERSION-deploy.tar.gz" > SHA256SUMS )
          NOTES=".github/release-notes/$TAG.md"
          # shellcheck disable=SC2016 # the backticks are Markdown, not an expansion
          { [ -f "$NOTES" ] && cat "$NOTES" && echo; \
            printf '## Install\n\n```bash\ncurl -L https://github.com/%s/releases/download/%s/%s-%s-deploy.tar.gz | tar xz\ncd %s-%s && cp .env.example .env && docker compose pull && docker compose up -d\n```\n\nImage: `%s:%s`. See README.md in the bundle.\n' \
              "$GITHUB_REPOSITORY" "$TAG" "$APP" "$VERSION" "$APP" "$VERSION" "$IMAGE" "$VERSION"; } > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Current ${{ inputs.tag || github.ref_name }}
          body_path: dist/notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/current-*-deploy.tar.gz
            dist/SHA256SUMS
